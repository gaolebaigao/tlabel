name: Adapter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run adapter tests
        run: pytest tests/ -v --tb=short

      - name: Schema validation
        run: |
          python -c "
          from tlabel.core.schema import validate_tlabel_v2
          from adapter.my_sensor import MySensorAdapter
          adapter = MySensorAdapter()
          # 验证 capabilities 完整性
          caps = adapter.get_capabilities()
          expected = {'contact','deformation_magnitude','force_magnitude','force_peak','force_direction','slip_entropy','slip_event','texture_energy','edge_density','contact_area','centroid_x','normal_field_magnitude','normal_field_variance','shear_field_magnitude','shear_field_direction','delta_force_normal','delta_force_shear','friction_cone_ratio','optical_flow_magnitude','optical_flow_direction','temporal_deformation_rate','contact_transition'}
          assert set(caps.keys()) == expected, f'Missing: {expected - set(caps.keys())}'
          # 验证 sensor_info
          info = adapter.get_sensor_info()
          assert 'type' in info and 'manufacturer' in info and 'model' in info
          print('✅ All schema validations passed')
          "

      - name: Check documentation
        run: |
          test -f README.md || (echo "❌ Missing README.md" && exit 1)
          ls examples/*.ipynb 2>/dev/null || (echo "❌ Missing example notebook" && exit 1)
          echo "✅ Documentation check passed"
