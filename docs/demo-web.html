<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLabel Web - 触觉数据标注平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .primitive-segment {
            transition: all 0.3s ease;
        }
        .primitive-segment:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .quality-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .quality-ok { background-color: #10b981; color: white; }
        .quality-ng { background-color: #ef4444; color: white; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">🦞 TLabel Web</h1>
            <p class="text-gray-600 mt-2">触觉数据全链路标注平台</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">上传数据</h2>
            <div class="flex gap-4">
                <button id="loadDemoBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition">
                    加载示例数据
                </button>
                <label class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg cursor-pointer transition">
                    上传 .tlabel 文件
                    <input type="file" id="fileUpload" accept=".json,.tlabel" class="hidden">
                </label>
            </div>
        </div>

        <!-- Data Overview -->
        <div id="dataOverview" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-xl font-semibold mb-4">📊 数据概览</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">传感器类型</div>
                    <div id="sensorType" class="text-lg font-bold text-blue-600">-</div>
                </div>
                <div class="bg-green-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">数据帧数</div>
                    <div id="numFrames" class="text-lg font-bold text-green-600">-</div>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">持续时间</div>
                    <div id="duration" class="text-lg font-bold text-purple-600">-</div>
                </div>
                <div class="bg-orange-50 p-4 rounded-lg">
                    <div class="text-sm text-gray-600">采样率</div>
                    <div id="fps" class="text-lg font-bold text-orange-600">-</div>
                </div>
            </div>
        </div>

        <!-- L1: Signal Visualization -->
        <div id="signalSection" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-xl font-semibold mb-4">📈 L1: 信号可视化</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">选择特征</label>
                <select id="featureSelect" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
                    <option value="">请选择...</option>
                </select>
            </div>
            <div style="position: relative; height: 300px;">
                <canvas id="signalChart"></canvas>
            </div>
        </div>

        <!-- L2: Primitive Timeline -->
        <div id="primitiveSection" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-xl font-semibold mb-4">🎯 L2: 动作分段 (Primitive)</h2>
            <div id="primitiveTimeline" class="space-y-2"></div>
            <div class="mt-4">
                <h3 class="text-sm font-semibold text-gray-700 mb-2">Primitive 图例</h3>
                <div id="primitiveLegend" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- L3: Quality Annotation -->
        <div id="qualitySection" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-xl font-semibold mb-4">✅ L3: 质量标注</h2>
            
            <!-- Golden Profile Comparison -->
            <div class="mb-6 border-b border-gray-200 pb-6">
                <h3 class="text-lg font-medium mb-3">🎯 Golden Profile 比对</h3>
                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">选择标准模板</label>
                        <select id="goldenProfileSelect" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <button onclick="compareWithGolden()" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-lg transition">
                        开始比对
                    </button>
                </div>
                <div id="qualityComparisonResult" class="mt-4 hidden"></div>
            </div>
            
            <!-- Manual Quality Annotation -->
            <div>
                <h3 class="text-lg font-medium mb-3">📝 手动质量标注</h3>
                <div class="mb-4">
                    <button id="addQualityBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg transition">
                        + 添加质量标注
                    </button>
                </div>
                <div id="qualityAnnotations" class="space-y-3"></div>
            </div>
        </div>

        <!-- Statistics -->
        <div id="statsSection" class="bg-white rounded-lg shadow-md p-6 hidden">
            <h2 class="text-xl font-semibold mb-4">📊 统计分析</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">Primitive 分布</h3>
                    <canvas id="primitiveChart"></canvas>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">质量统计</h3>
                    <canvas id="qualityChart"></canvas>
                </div>
            </div>
        </div>
    </div>

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('loadDemoBtn').addEventListener('click', loadDemoData);
    document.getElementById('fileUpload').addEventListener('change', handleFileUpload);
    document.getElementById('featureSelect').addEventListener('change', updateSignalChart);
    document.getElementById('addQualityBtn').addEventListener('click', addQualityAnnotation);
});

// Load demo data from API
async function loadDemoData() {
    try {
        // Use embedded demo data
        currentData = EMBEDDED_DEMO_DATA;
        displayData(currentData);
    } catch (error) {
        alert('加载示例数据失败: ' + error.message);
    }
}

// Handle file upload
async function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);

    try {
        const response = await fetch(`${API_BASE}/api/upload`, {
            method: 'POST',
            body: formData
        });

        if (!response.ok) throw new Error('Failed to upload file');

        currentData = await response.json();
        displayData(currentData);
    } catch (error) {
        alert('上传失败: ' + error.message);
    }
}

// Display all data
function displayData(data) {
    // Show all sections
    document.getElementById('dataOverview').classList.remove('hidden');
    document.getElementById('signalSection').classList.remove('hidden');
    document.getElementById('primitiveSection').classList.remove('hidden');
    document.getElementById('qualitySection').classList.remove('hidden');
    document.getElementById('statsSection').classList.remove('hidden');

    // Update overview
    document.getElementById('sensorType').textContent = data.sensor.type;
    document.getElementById('numFrames').textContent = data.num_frames;
    document.getElementById('duration').textContent = `${data.duration_s.toFixed(2)}s`;
    document.getElementById('fps').textContent = `${data.fps} Hz`;

    // Populate feature select
    const featureSelect = document.getElementById('featureSelect');
    featureSelect.innerHTML = '<option value="">请选择...</option>';
    Object.keys(data.features.features).forEach(feature => {
        const option = document.createElement('option');
        option.value = feature;
        option.textContent = feature;
        featureSelect.appendChild(option);
    });

    // Display primitives
    displayPrimitives(data.primitives);

    // Display quality annotations
    displayQualityAnnotations();

    // Update charts
    updateCharts(data);
}

// Display primitive timeline
function displayPrimitives(primitives) {
    const container = document.getElementById('primitiveTimeline');
    container.innerHTML = '';

    primitives.forEach((prim, index) => {
        const duration = prim.end_time - prim.start_time;
        const div = document.createElement('div');
        div.className = 'primitive-segment p-3 rounded-lg border-l-4 cursor-pointer';
        div.style.borderLeftColor = prim.color;
        div.style.backgroundColor = `${prim.color}20`;
        
        div.innerHTML = `
            <div class="flex justify-between items-center">
                <div>
                    <span class="font-semibold text-gray-800">${prim.primitive}</span>
                    <span class="text-sm text-gray-600 ml-2">
                        帧 ${prim.start_frame}-${prim.end_frame} | 
                        ${prim.start_time.toFixed(2)}s - ${prim.end_time.toFixed(2)}s
                    </span>
                </div>
                <div class="text-sm text-gray-500">
                    时长: ${duration.toFixed(2)}s | 置信度: ${(prim.confidence * 100).toFixed(0)}%
                </div>
            </div>
        `;
        
        container.appendChild(div);
    });

    // Update legend
    const legendContainer = document.getElementById('primitiveLegend');
    const uniquePrimitives = [...new Set(primitives.map(p => ({name: p.primitive, color: p.color})))];
    legendContainer.innerHTML = uniquePrimitives.map(p => `
        <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded" style="background-color: ${p.color}"></div>
            <span class="text-sm">${p.name}</span>
        </div>
    `).join('');
}

// Update signal chart
function updateSignalChart() {
    if (!currentData) return;

    const feature = document.getElementById('featureSelect').value;
    if (!feature) return;

    const ctx = document.getElementById('signalChart').getContext('2d');
    
    if (signalChart) {
        signalChart.destroy();
    }

    signalChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: currentData.features.timestamps,
            datasets: [{
                label: feature,
                data: currentData.features.features[feature],
                borderColor: 'rgb(59, 130, 246)',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: true,
                    position: 'top'
                },
                tooltip: {
                    mode: 'index',
                    intersect: false
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: '时间 (s)'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: '数值'
                    }
                }
            },
            interaction: {
                mode: 'nearest',
                axis: 'x',
                intersect: false
            }
        }
    });
}

// Update all charts
function updateCharts(data) {
    // Primitive distribution chart
    const primCtx = document.getElementById('primitiveChart').getContext('2d');
    if (primitiveChart) {
        primitiveChart.destroy();
    }

    const primitiveCounts = {};
    data.primitives.forEach(p => {
        primitiveCounts[p.primitive] = (primitiveCounts[p.primitive] || 0) + 1;
    });

    primitiveChart = new Chart(primCtx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(primitiveCounts),
            datasets: [{
                data: Object.values(primitiveCounts),
                backgroundColor: Object.keys(primitiveCounts).map(p => 
                    data.primitives.find(pp => pp.primitive === p)?.color || '#999'
                )
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });

    // Quality chart
    updateQualityChart();
}

// Add quality annotation
function addQualityAnnotation() {
    if (!currentData) {
        alert('请先加载数据');
        return;
    }

    const annotation = {
        id: Date.now(),
        startTime: 0,
        endTime: currentData.duration_s,
        quality: 'OK',
        defectType: '',
        notes: ''
    };

    qualityAnnotations.push(annotation);
    displayQualityAnnotations();
}

// Display quality annotations
function displayQualityAnnotations() {
    const container = document.getElementById('qualityAnnotations');

    if (qualityAnnotations.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm">暂无质量标注，点击"添加质量标注"开始</p>';

        const div = document.createElement('div');
        div.className = 'border border-gray-200 rounded-lg p-4';

                    <div class="flex gap-2">
                        <input type="number" step="0.01" value="${ann.startTime}" 
                               onchange="updateQualityAnnotation(${index}, 'startTime', this.value)"
                               class="border border-gray-300 rounded px-2 py-1 w-20">
                        <span class="self-center">-</span>
                        <input type="number" step="0.01" value="${ann.endTime}" 
                               onchange="updateQualityAnnotation(${index}, 'endTime', this.value)"
                               class="border border-gray-300 rounded px-2 py-1 w-20">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">质量</label>
                    <select onchange="updateQualityAnnotation(${index}, 'quality', this.value)"
                            class="border border-gray-300 rounded px-2 py-1 w-full">
                        <option value="OK" ${ann.quality === 'OK' ? 'selected' : ''}>OK</option>

                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">缺陷类型</label>
                    <input type="text" value="${ann.defectType}"

                           placeholder="如: 压力不足"
                           class="border border-gray-300 rounded px-2 py-1 w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                    <input type="text" value="${ann.notes}" 
                           onchange="updateQualityAnnotation(${index}, 'notes', this.value)"
                           placeholder="可选备注"
                           class="border border-gray-300 rounded px-2 py-1 w-full">
                </div>
            </div>
            <div class="mt-2 flex justify-end">
                <button onclick="removeQualityAnnotation(${index})"

                    删除
                </button>
            </div>
        `;
        container.appendChild(div);
    });

    updateQualityChart();
}

// Update quality annotation
function updateQualityAnnotation(index, field, value) {
    if (field === 'startTime' || field === 'endTime') {
        qualityAnnotations[index][field] = parseFloat(value);
    } else {
        qualityAnnotations[index][field] = value;
    }
    updateQualityChart();
}

// Remove quality annotation
function removeQualityAnnotation(index) {
    qualityAnnotations.splice(index, 1);
    displayQualityAnnotations();
}

// Update quality chart
function updateQualityChart() {
    const ctx = document.getElementById('qualityChart').getContext('2d');
    if (qualityChart) {
        qualityChart.destroy();
    }

    const qualityCounts = {
        'OK': qualityAnnotations.filter(a => a.quality === 'OK').length,
        'NG': qualityAnnotations.filter(a => a.quality === 'NG').length
    };

    qualityChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['OK', 'NG'],
            datasets: [{
                data: [qualityCounts.OK, qualityCounts.NG],
                backgroundColor: ['#10b981', '#ef4444']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
}

// Embedded Golden Profile standards for client-side comparison
const GOLDEN_PROFILES = {
    "grasp_golden": {
        id: "grasp_golden",
        task: "robotic_grasp",
        description: "Standard force profile for successful object grasping",
        sensor_type: "gelsight_mini",
        thresholds: {
            force_peak_min: 0.8,    // N - minimum peak force for stable grasp
            force_peak_max: 1.5,    // N - maximum safe force
            contact_time_min: 1.5,  // s - minimum contact duration
            slip_event_max: 0,      // no slip events during stable grasp
            friction_ratio_min: 0.7 // minimum friction cone ratio
        }
    }
};

function performLocalComparison(data, profileId) {
    const profile = GOLDEN_PROFILES[profileId];
    if (!profile) {
        throw new Error('Golden Profile not found: ' + profileId);
    }

    const features = data.features.features;
    const timestamps = data.features.timestamps;
    const th = profile.thresholds;
    const deviations = [];
    let qualityScore = 100;

    // Check 1: Peak force magnitude
    const forcePeak = features.force_peak || [];
    const maxForce = Math.max(...forcePeak);
    const minForce = Math.min(...forcePeak.filter(v => v > 0));
    
    if (maxForce < th.force_peak_min) {
        deviations.push({
            type: "force_peak_insufficient",
            severity: "error",
            phase: "grasp_hold",
            expected: `≥ ${th.force_peak_min} N`,
            actual: `${maxForce.toFixed(3)} N`,
            timestamp: timestamps[forcePeak.indexOf(maxForce)] || 0
        });
        qualityScore -= 25;
    }
    if (maxForce > th.force_peak_max) {
        deviations.push({
            type: "force_peak_excessive",
            severity: "warning",
            phase: "grasp_hold",
            expected: `≤ ${th.force_peak_max} N`,
            actual: `${maxForce.toFixed(3)} N`,
            timestamp: timestamps[forcePeak.indexOf(maxForce)] || 0
        });
        qualityScore -= 10;
    }

    // Check 2: Contact duration
    const contact = features.contact || [];
    const contactFrames = contact.filter(v => v > 0.5).length;
    const contactDuration = (contactFrames / data.fps).toFixed(2);
    
    if (parseFloat(contactDuration) < th.contact_time_min) {
        deviations.push({
            type: "contact_duration_short",
            severity: "warning",
            phase: "grasp_hold",
            expected: `≥ ${th.contact_time_min} s`,
            actual: `${contactDuration} s`,
            timestamp: 0
        });
        qualityScore -= 15;
    }

    // Check 3: Slip events during stable grasp
    const slipEvent = features.slip_event || [];
    const slipFrames = slipEvent.filter(v => v > 0).length;
    
    // Find frames where contact > 0.5 and check for slips
    let slipDuringGrasp = 0;
    for (let i = 0; i < contact.length; i++) {
        if (contact[i] > 0.5 && slipEvent[i] > 0) {
            slipDuringGrasp++;
        }
    }
    
    if (slipDuringGrasp > th.slip_event_max) {
        deviations.push({
            type: "slip_detected_during_grasp",
            severity: "error",
            phase: "grasp_hold",
            expected: `${th.slip_event_max} slip events`,
            actual: `${slipDuringGrasp} frames with slip`,
            timestamp: timestamps[slipEvent.findIndex((v, i) => contact[i] > 0.5 && v > 0)] || 0
        });
        qualityScore -= 20;
    }

    // Check 4: Friction cone ratio during stable grasp
    const frictionRatio = features.friction_cone_ratio || [];
    let lowFrictionFrames = 0;
    let lowFrictionStart = -1;
    for (let i = 0; i < frictionRatio.length; i++) {
        if (contact[i] > 0.5 && frictionRatio[i] < th.friction_ratio_min) {
            lowFrictionFrames++;
            if (lowFrictionStart < 0) lowFrictionStart = i;
        }
    }
    
    if (lowFrictionFrames > 5) {
        deviations.push({
            type: "friction_cone_low",
            severity: "warning",
            phase: "grasp_hold",
            expected: `≥ ${th.friction_ratio_min}`,
            actual: `${(frictionRatio.filter((v, i) => contact[i] > 0.5).reduce((a, b) => Math.min(a, b), 1)).toFixed(3)} min`,
            timestamp: timestamps[lowFrictionStart] || 0
        });
        qualityScore -= 10;
    }

    qualityScore = Math.max(0, qualityScore);

    return {
        quality_score: qualityScore,
        passed: qualityScore >= 70 && deviations.filter(d => d.severity === 'error').length === 0,
        deviations: deviations,
        profile_name: profile.task,
        data_summary: `${data.num_frames} frames, ${data.duration_s.toFixed(2)}s`
    };
}

function displayQualityComparison(result) {
    const container = document.getElementById('qualityComparisonResult');
    container.classList.remove('hidden');

    const scoreColor = result.quality_score >= 80 ? 'text-green-600' : 
                       result.quality_score >= 70 ? 'text-yellow-600' : 'text-red-600';
    
    const statusBadge = result.passed ? 
        '<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">✓ PASS</span>' :
        '<span class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-sm font-medium">✗ FAIL</span>';

    let deviationsHtml = '';
    if (result.deviations.length > 0) {
        deviationsHtml = `
            <div class="mt-4">
                <h4 class="font-medium text-gray-900 mb-2">偏差详情 (${result.deviations.length})</h4>
                <div class="space-y-2">
                    ${result.deviations.map(dev => `
                        <div class="border-l-4 ${dev.severity === 'error' ? 'border-red-500 bg-red-50' : 'border-yellow-500 bg-yellow-50'} p-3 rounded">
                            <div class="flex items-center justify-between">
                                <span class="font-medium">${dev.type.replace('_', ' ')}</span>
                                <span class="text-sm ${dev.severity === 'error' ? 'text-red-600' : 'text-yellow-600'}">
                                    ${dev.severity === 'error' ? '⚠ Error' : '⚡ Warning'}
                                </span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1">
                                阶段: ${dev.phase || 'N/A'} | 
                                期望: ${dev.expected} | 
                                实际: ${dev.actual} | 
                                时间: ${dev.timestamp.toFixed(2)}s
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    } else {
        deviationsHtml = '<p class="text-green-600 mt-4">✓ 所有指标符合 Golden Profile 标准</p>';
    }

    container.innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-medium text-gray-900">质量比对结果</h3>
            ${statusBadge}
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="text-sm text-gray-600">质量得分</p>
                <p class="text-3xl font-bold ${scoreColor}">${result.quality_score}</p>
            </div>
            <div>
                <p class="text-sm text-gray-600">偏差数量</p>
                <p class="text-3xl font-bold text-gray-900">${result.deviations.length}</p>
            </div>
        </div>
        ${deviationsHtml}
    `;
}

// Load golden profiles on page load
document.addEventListener('DOMContentLoaded', () => {
    loadGoldenProfiles();
});
</script>
</body>
</html>
